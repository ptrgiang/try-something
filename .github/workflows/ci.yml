name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Astro sets a minimum Node patch; the runner cache can lag behind it.
          check-latest: true
          cache: npm
      - name: Migration guard
        run: node scripts/check-migrations.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - name: Repository guard
        run: node scripts/check-repo.mjs
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Staging build resolves its own bindings
        run: CLOUDFLARE_ENV=staging npm run build
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # No --with-deps: it apt-installs fonts from the Azure Ubuntu mirror, whose DNS outages failed CI.
      # The runner image ships Chrome, so Chromium's shared libraries are already there, and no test compares pixels.
      - name: Install Chromium
        run: npx playwright install chromium
      - name: End-to-end tests (local Workers runtime + local D1)
        run: |
          printf 'PUBLIC_SITE_URL=http://localhost:4321\nBETTER_AUTH_SECRET=%s\nTURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA\n' "$(openssl rand -base64 32)" > .dev.vars
          npm run db:migrate:local
          npm run db:seed:local
          npm run e2e
