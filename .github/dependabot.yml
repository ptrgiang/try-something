version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      dev:
        dependency-type: development
    ignore:
      # @astrojs/check doesn't accept TypeScript 7 yet (npm ci fails with ERESOLVE).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Newer satori shapes text with HarfBuzz, which compiles wasm at runtime; Workers forbid it, so OG images 500.
      # See "Dependencies" in docs/ARCHITECTURE.md.
      - dependency-name: satori
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
